[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
lib_deps = 
	khoih-prog/nRF52_MBED_PWM@^1.0.3
	khoih-prog/NRF52_MBED_TimerInterrupt@^1.4.1

[platformio]
description = a project that tests the hardware timers on the Arduino Nano 33 BLE for PWM control
